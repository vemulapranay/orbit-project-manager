services:
  - type: web
    name: orbit-api
    branch: submission
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --frozen-lockfile --filter @orbit/api... && pnpm --filter @orbit/api exec prisma generate && pnpm --filter @orbit/api build
    startCommand: pnpm --filter @orbit/api exec prisma migrate deploy && pnpm --filter @orbit/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://orbit-web-live.onrender.com

  - type: web
    name: orbit-web
    branch: submission
    runtime: static
    buildCommand: pnpm install --frozen-lockfile --filter @orbit/web... && pnpm --filter @orbit/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://orbit-api-g2o5.onrender.com/api

databases:
  - name: orbit-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: orbit
    user: orbit
